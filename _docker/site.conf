server {
    listen 80;
    server_name _;
    error_log  /dev/stdout info;
    access_log /dev/stdout;

    root /static;
    index /index.html;

    error_page 404 /index.html;
    error_page 500 /index.html;

    # Resolve the Go container through Docker's DNS on every request (cached 10s)
    # instead of once at startup. A literal hostname in proxy_pass is resolved
    # only when nginx starts, so a recreated Go container with a new IP left
    # nginx proxying to a dead address. Using a variable forces re-resolution.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $go_upstream http://fpl-live-match-go-prod:8199;
        proxy_pass $go_upstream;
        proxy_set_header Host $host;
    }

    location = / {
        try_files /index.html /index.html;
        add_header Cache-Control 'no-store';
    }

    # Static and assets
    location /static {
        expires 30d;
    }
}
